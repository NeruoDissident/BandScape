<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BandScape</title>
    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BandScape" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Service worker registration lives in src/pwa.js (imported by
         main.jsx), which also handles updates on reopen. Registering it
         here too would double-register and skip the update handling. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
